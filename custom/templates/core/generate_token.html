{% extends 'core/base.html' %}

{% block content %}

<!--header-->
{% include 'core/header.html' %}

<!--aside-->
{% include 'core/aside.html' %}

<!--contents-->
<!-- Content Wrapper. Contains page content -->
  <div class="content-wrapper">
    <!-- Content Header (Page header) -->
    <section class="content-header">
      <h1>
      Create Token
      </h1>
      <ol class="breadcrumb">
        <li><a href="#"><i class="fa fa-dashboard"></i> Home</a></li>
        <li class="active">Token Master</li>
      </ol>
    </section>

    <!-- Main content -->
    <section class="content">
        <div class="row">
            <div class="col-md-12">
                <div class="box box-info">
                    <div class="box-header with-border">
                        <h3 class="box-title">
                                            Fill Details</h3>
                    </div>
                    <form method='POST'>
                        {% csrf_token %}
                        <div class="form-horizontal">
                            <div class="box-body">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">
                                        Choose Category</label>
                                    <div class="col-sm-5">
                                        <select name="category" class="form-control">
                                        {% for category in categories %}
                                        <option value="{{category.id}}">{{category.title}}</option>
                                        {% endfor %}
                                    </select>
                                    </div>
                                </div>
                            </div>
                            <div class="box-body">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">
                                        Token Description</label>
                                    <div class="col-sm-5">
                                        <input type="text" name="description" class="form-control">
                                    </div>
                                </div>
                            </div>
                            <div class="box-body">
                                <div class="form-group">
                                    <label class="col-sm-2 control-label">
                                        Number Of Tokens</label>
                                    <div class="col-sm-5">
                                        <input type="number" name="number_of_token" class="form-control">
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="box-footer">
                            <button class="btn btn-info pull-right" type="submit">Create</button>
                            <span id="ContentPlaceHolder1_lblMsg" style="color:Red;"></span>
                        </div>
                    </form>
                </div>
            </div>
            </div>
        </div>
    </section>
    <!-- /.content -->
  </div>
  <!-- /.content-wrapper -->


<!--footer-->
{% include 'core/footer.html' %}

<!--control aside-->
{% include 'core/c_aside.html' %}

{% endblock %}
