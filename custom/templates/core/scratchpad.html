          <div class="box box-info">
            <div class="box-body">
                <div class="form-group">
                  {% render_field form.question rows="3" class+="form-control" placeholder="Type your question here" %}
                </div>
            </div>
            <div class="box-body">
              <div class="row">
                <div class="col-xs-3">
                  <label class="btn btn-default btn-file">
                    Image {% render_field form.image style="display: none;" %}
                  </label>
                </div>
                  <label class="btn btn-default btn-file">
                    Audio {% render_field form.audio style="display: none;" %}
                  </label>
                <div class="col-xs-5">
                  <label class="btn btn-default btn-file">
                    Video {% render_field form.video style="display: none;" %}
                  </label>
                </div>
              </div>
            </div>
            <!-- /.box-body -->
          </div>
