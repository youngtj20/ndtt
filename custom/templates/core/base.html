{% load static %}
<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<title>Driver Theory Test</title>
	<!-- Tell the browser to be responsive to screen width -->
	<meta content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" name="viewport">
	{% block page_css %}
	<!-- Bootstrap 3.3.5 -->
	<link rel="stylesheet" href="/static/core/bootstrap/css/bootstrap.min.css">
	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.5.0/css/font-awesome.min.css">
	<!-- Ionicons -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/ionicons/2.0.1/css/ionicons.min.css">

	<link rel="stylesheet" href="/static/core/dist/css/AdminLTE.min.css">

	<!-- AdminLTE Skins. Choose a skin from the css/skins
			 folder instead of downloading all of them to reduce the load. -->
	<link rel="stylesheet" href="/static/core/dist/css/skins/_all-skins.min.css">
	<!-- iCheck -->
	<link rel="stylesheet" href="/static/core/plugins/iCheck/flat/blue.css">
	<!-- Morris chart -->
	<link rel="stylesheet" href="/static/core/plugins/morris/morris.css">
	<!-- jvectormap -->
	<link rel="stylesheet" href="/static/core/plugins/jvectormap/jquery-jvectormap-1.2.2.css">

	<link rel="stylesheet" href="/static/core/plugins/datepicker/datepicker3.css">

	<link rel="stylesheet" href="/static/core/plugins/daterangepicker/daterangepicker-bs3.css">

	<link rel="stylesheet" href="/static/core/plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.min.css">

	{% block extra_css %} {% endblock %}

	<![endif]-->
</head>

{% block body %}
<body class="hold-transition skin-blue sidebar-mini">
{% endblock %}

{% block content %}
	main content goes here
{% endblock %}


<!-- jQuery 2.2.0 -->
<script src="/static/custom/js/jquery.js"></script>
<script src="/static/core/plugins/jQuery/jQuery-2.2.0.min.js"></script>

{% block page_js %}
<!--<script src="https://ajax.googleapis.com/ajax/libs/jquery/2.2.0/jquery.min.js"></script>-->
<!-- jQuery UI 1.11.4 -->
<script src="https://code.jquery.com/ui/1.11.4/jquery-ui.min.js"></script>
<script src="/static/core/js/jquery-ui.min.js"></script>
<!-- Resolve conflict in jQuery UI tooltip with Bootstrap tooltip -->
<script>
	$.widget.bridge('uibutton', $.ui.button);
</script>
<!-- Bootstrap 3.3.5 -->
<script src="/static/core/bootstrap/js/bootstrap.min.js"></script>
<!-- Morris.js charts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/raphael/2.1.0/raphael-min.js"></script>
<script src="/static/core/plugins/morris/morris.min.js"></script>
<!-- Sparkline -->
<script src="/static/core/plugins/sparkline/jquery.sparkline.min.js"></script>
<!-- jvectormap -->
<script src="/static/core/plugins/jvectormap/jquery-jvectormap-1.2.2.min.js"></script>
<script src="/static/core/plugins/jvectormap/jquery-jvectormap-world-mill-en.js"></script>
<!-- jQuery Knob Chart -->
<script src="/static/core/plugins/knob/jquery.knob.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.11.2/moment.min.js"></script>
<script src="/static/core/plugins/daterangepicker/daterangepicker.js"></script>

<script src="/static/core/plugins/datepicker/bootstrap-datepicker.js"></script>
<!-- Bootstrap WYSIHTML5 -->
<script src="/static/core/plugins/bootstrap-wysihtml5/bootstrap3-wysihtml5.all.min.js"></script>
<!-- Slimscroll -->
<script src="/static/core/plugins/slimScroll/jquery.slimscroll.min.js"></script>
<!-- FastClick -->
<script src="/static/core/plugins/fastclick/fastclick.js"></script>
<!-- AdminLTE App -->
<script src="/static/core/dist/js/app.min.js"></script>

<script>
	$(document).ready(function () {
	    $('.date').datepicker({
	        format: "yyyy-mm-dd",
	        autoclose: true,
	        todayHighlight: true,
	        clearBtn: true,
	    });
	
	    //Alternativ way

	    // });
	
	});
</script>
{% endblock %}
