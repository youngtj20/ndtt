<body>
	<!-- <div class="navbar navbar-static-top">
		<center>
			<h3>{{exam_participant.exam}} Theory Test</h3>

	</div> -->
	<!-- Main content -->
	<div class="header">
		<div class="leftheader">
			<h2>{{exam_participant.exam}} Theory Test</h2>
		</div>
		<div class="rightheader">
			<div id="countdown"></div>
		</div>
	</div>
	<div class="row" style="padding: 0px 10px;">
		
		<div class="col-md-12">
			<div class="box-body">
				<!-- Intro Section -->
				<section id="intro" class="intro-section">
					<div class="container-fluid mother-frame">
						<div class="row child-frame">
							<div id="exam_area" style="display: inline;">
								<!-- <div class="col-md-6 col-md-offset-3">
										<div id="countdown"></div>
									</div> -->
								<div class="col-lg-4" data-bind="if: questions().length > 0">
									<!-- Left Panel -->
									<div class="candidate-detail">
										<img class="candidate-photo"
											src="{% if title.photo %}{{title.photo.url}}{%else %}{{'/static/custom/img/xuser.png'}}{%endif%}"
											alt="">
										<h3 class="candidate-name">{{title}}</h3>
									</div>
									<div class="question_label" data-bind='foreach: questions'>
										<span class="btn btn-info but"
											data-bind="text: ($index() + 1), click: $parent.setPageIndex($index()), css: responseStatus, attr: {id: $parent.questions()[$index()].id}"></span>
									</div>
									<div>
										<center>
											<span id="video" style="max-width: 240px; max-height: 240px;"></span>
										</center>
									</div>
								</div> <!-- Left Panel -->
								<div class="col-lg-8" data-bind="if: questions().length > 0">
									<!-- Main Panel -->
									<p class="question">
										<span
											data-bind="visible: questions()[pageIndex()].audio_url, click: audioQuestionPlay"
											class="qaudioButton"></span>
										<span style="font-weight: bolder;"
											data-bind='text: questions()[pageIndex()].human_readable_question_no'></span>.
										<span data-bind='html: questions()[pageIndex()].question_description'></span>
										<div data-bind="if: questions()[pageIndex()].image_url" id="image">
											<center>
												<img data-bind="attr: {src: questions()[pageIndex()].image_url}">
											</center>
										</div>
									</p>
									<div class="option">
										<form role="form">
											<ul class="option_list"
												data-bind="foreach: { data: questions()[pageIndex()].choices, afterRender: aftermaths }">
												<li class="option-list unselected">
													<div data-bind="visible: audio_url, click: playAudio"
														class="audioButton"></div>
													<div
														data-bind="css: $root.questions()[$root.pageIndex()].question_type == 0 ? 'radio' : 'checkbox'">
														<label style="padding-bottom:0px;" data-bind="attr: {for: id} ">
															<input class="choice_box styledRadio"
																data-bind="if: $root.questions()[$root.pageIndex()].question_type == 0, attr: {value: id, id: id, type: $root.questions()[$root.pageIndex()].question_type == 0 ? 'radio' : 'checkbox', name:'choice' }, checked: $root.questions()[$root.pageIndex()].selected_choices">
															<input class="choice_box styledRadio"
																data-bind="if: $root.questions()[$root.pageIndex()].question_type == 1, attr: {value: id, id: id, type: $root.questions()[$root.pageIndex()].question_type == 0 ? 'radio' : 'checkbox', name:'choice' }, checked: $root.questions()[$root.pageIndex()].selected_choices">
															<div data-bind="if: image_url" id="optImage">
																<center>
																	<img data-bind="attr: {src: image_url}">
																</center>
															</div>
															<span class="choice" data-bind='html: description'></span>
														</label>
													</div>
												</li>
											</ul>
											<ul class="option_list"
												data-bind="visible: questions()[pageIndex()].question_type == 2">
												<li>
													<textarea class="form-control" type="text"
														data-bind="value: questions()[pageIndex()].text_entry" /></textarea>
												</li>
											</ul>
										</form>
									</div>
									<div id="action_area">
										<center>
											<button data-bind="css: { disabled: atFirstPage }, click: previousPage"
												type="button"
												class="btn large btn-primary active round">Previous</button>
											<button data-bind="css: { disabled: atLastPage }, click: nextPage"
												type="button" class="btn large btn-primary active round">Next</button>
											<button data-bind="visible: atLastPage, click: finishTest" type="button"
												class="btn large btn-success active round">Finish Test</button>
											<a href="/ap/logout" style="float: right;" data-bind="visible: atLastPage"
												class="btn medium btn-danger">Logout</a>
										</center>
									</div>
								</div> <!-- Main Panel -->
								<div class="col-lg-12" data-bind="if: questions().length == 0">
									<center>
										<h1>Loading Exam...Please wait</h1>
									</center>
								</div>
							</div> <!-- exam_area -->
						</div>
					</div>
				</section>
			</div>
			<!-- /.box-body -->
			<div class="box-footer">
				<span id="ContentPlaceHolder1_lblMsg" style="color:Red;"></span>
			</div>
		</div>
	</div>
	</div>
	<!-- /.content -->
