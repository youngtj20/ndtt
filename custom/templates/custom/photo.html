<head>

    <!-- Bootstrap Core CSS -->

    <!-- Custom CSS -->

    <!-- jQuery -->
    <script src="/static/custom/js/jquery.js"></script>
    <script src="/static/custom/js/camera.js"></script>
    <script src="/static/custom/js/knockout-3.4.0.js"></script>

    <!-- HTML5 Shim and Respond.js IE8 support of HTML5 elements and media queries -->

        <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>

    <style type="text/css">

      /* Import dulu */
        @import url(http://fonts.googleapis.com/css?family=Roboto);

        body {
          letter-spacing: 0.1em;
          color: #444;
          background:#2e2e2e;
          background-image: url('/static/custom/images/viobg.jpg');
          background-position: center;
          background-attachment: fixed;
          /*Added Recently*/
          font-family: 'Roboto', sans-serif;
          font-size:14px;
          line-height:1.5;
          cursor:default;
          color:#707070
        }

        h1, h2, h3, h4, h5, h6{
          font-family: 'Oswald', sans-serif;
          font-weight:normal;
          margin-bottom:10px;
        }

        .styledRadio, .styledCheckbox {
          display: inline-block;
        }

        .mother-frame{
            background-color: #000000; 
            border-radius: 10px;
            /*padding:10px; */
            min-height: 400px;
            /*background-image: url('img/vio.png');*/
        }

        .child-frame {
            background-color: #fff; 
            border-radius: 10px;
            margin: 10px; 
            margin-top: 10px;
            padding: 10px;
            z-index: 300;
            min-height: 400px;
        }

        .option ul{
          list-style: none;
        }

        .option_list li {
            background-color: rgb(239, 239, 239); 
            padding: 10px;
            border-radius: 5px;
            margin: 20px;
        }

        .round {
            /*border-radius: 40px;*/
            /*margin-right: 20px;*/
        }

        .but {
            width: 35px; 
            height: 35px;
            margin: 5px;
        }

        .choice{
          margin-left: 10px;
          line-height: 43px;
          font-size: 14px;
          /*vertical-align: 14px;*/
          padding-right: 20px;
        }

        #action_area{
          margin-top: 50px;
          margin-bottom: 10px;
        }

        .audioButton {
            position: absolute;
            right: 10px;
            /*margin-top: -30px;*/
            margin-top: 0;
            margin-right: 30px;
            display: block;
            width: 30px;
            height: 30px;
            background-image: url('/static/custom/img/giant.png');
            background-repeat: no-repeat;
            background-position: 0 -901px;
        }

        .qaudioButton {
            right: 40px;
            position: absolute;
            display: block;
            width: 30px;
            height: 30px;
            background-image: url('/static/custom/img/giant.png');
            background-repeat: no-repeat;
            background-position: 0 -901px;
        }

        .question{
          font-size: 16px;
          margin: 50px;
        }

    </style>

    <script type="text/javascript">

    $( document ).ready(function() {
      start_video_for_still();
    });
    
    </script>

</head>

<!-- The #page-top ID is part of the scrolling feature - the data-spy and data-target are part of the built-in Bootstrap scrollspy function -->

<body>

    <!-- Intro Section -->
    <section id="intro" class="intro-section" style="padding-top: 100px;">
        <div class="container mother-frame">
            <div class="row child-frame">
                <!-- STAGE II -->

<!--                 <div class="col-md-6 col-md-offset-3">
                <div class="login-panel panel-default"> -->

                <div id="photograph_area"  style="display: inline;">
                  <div class="head">
                    <h1>Photo Capture</h1>
                  </div>
                  <div id="camera"></div>
                  <form action="/ap/capture_photo" id="myuploadcapture" method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <input id="myphotodata" type="hidden" name="myphotodata" value=""/>
                    <input id="examination_number" type="hidden" name="myId" value=""/>
                    <div id="pre_take_buttons">
                      <input class="btn btn-primary" type="button" value="Take Snapshot" onClick="preview_snapshot()">
                      <a href="/ap/logout">Logout</a>
                    </div>
                    <div id="post_take_buttons" style="display:none">
                      <input class="btn btn-default" type="button" value="&lt; Take Another" onClick="cancel_preview()">
                      <input class="btn btn-primary" type="button" value="Save Photo &gt;" onClick="save_photo()" style="font-weight:bold;">
                    </div>
                  </form>
                </div> <!-- photograph_area -->

                <!-- </div>
                </div> -->
        </div>
    </section>

    <!-- Bootstrap Core JavaScript -->
    <script src="/static/custom/js/bootstrap.min.js"></script>

    <!-- Scrolling Nav JavaScript -->
    <script src="/static/custom/js/jquery.easing.min.js"></script>
    <!--<script src="/static/custom/js/scrolling-nav.js"></script> -->
    <script src="/static/custom/js/webcamjs/webcam.js"></script>

</body>

</html>
